---
# =============================================================================
# Minimum pipeline that exercises three things at once:
#
#   1. JSON Loader   -- Loader.filepath ends in .json, so LoaderFileExt.get()
#                       resolves to JSONTYPE and LoaderPandasJson runs
#                       pd.read_json  (petsard/loader/loader_pandas.py)
#   2. AdvGAN        -- Synthesizer.method: 'AdvGAN' maps to SynthesizerMap.ADVGAN,
#                       which lazily loads the torch+opacus AdvGANSynthesizer in
#                       petsard/synthesizer/DP_AdvGAN.py (NOT AdvGAN.py -- see
#                       Synthesizer._get_synthesizer_class in synthesizer.py)
#   3. Reporter JSON -- Reporter.type: 'json' flips BaseReporter._save() from
#                       to_csv to to_json  (petsard/reporter/reporter_base.py:640)
#
# NOTE ON BLOCK ORDER: petsard/config.py:40 does `self.sequence =
# list(self.yaml.keys())` -- the execution order IS the YAML key order. Do not
# reorder these blocks.
#
# Run:  python test_json_advgan.py
# =============================================================================

Loader:
  load_json:
    # .json extension is what selects LoaderPandasJson. The file is a top-level
    # JSON array of objects (records orient), which pd.read_json accepts with
    # no extra arguments.
    filepath: ./demo_json/data/test_json_data.json

Preprocessor:
  demo:
    # Required: AdvGAN trains on a float32 tensor of the table (DP_AdvGAN.py),
    # so the default preprocessor encodes the categorical 'sex'/'smoker' columns
    # and fills the two nulls planted in the test data.
    method: 'default'

Synthesizer:
  demo:
    method: 'AdvGAN'
    sigma: 1.0    # -> noise_multiplier for the opacus DP-SGD on the discriminator
    outlier: 10   # -> LAMBDA_BOUND, weight of the min/max boundary penalty
    epochs: 5     # kept small so the test finishes in seconds (200 is the default)
    sample_num_rows: 100

Postprocessor:
  demo:
    # Inverts the preprocessor so the reported data is back in original units
    # and 'sex'/'smoker' are strings again -- which also makes the JSON output
    # human-readable.
    method: 'default'

Evaluator:
  # Only here so `save_report` has something to report. Must sit BEFORE
  # Reporter -- see the block-order note above.
  diagnostic:
    method: sdmetrics-diagnosticreport

Reporter:
  save_synthetic:
    method: save_data
    source: Postprocessor
    output: './demo_json/output/advgan'
    type: 'json'        # <-- the feature under test
  evaluation_report:
    method: save_report
    granularity: global
    output: './demo_json/output/advgan'
    type: 'json'        # <-- same flag on the other _save() caller
...
