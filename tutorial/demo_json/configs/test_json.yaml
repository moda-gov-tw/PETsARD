---
# =============================================================================
# JSON demo 1 of 3 -- feature test on a small file (30 rows x 6 columns).
#
# Minimum pipeline that exercises the JSON features at once:
#
#   1. JSON Loader   -- Loader.filepath ends in .json, so LoaderFileExt.get()
#                       resolves to JSONTYPE and LoaderPandasJson runs
#                       pd.read_json  (petsard/loader/loader_pandas.py)
#   2. Preprocessor  -- the default preprocessor encodes the categorical
#                       'sex'/'smoker' columns and fills the two nulls planted
#                       in the test data
#   3. Reporter JSON -- Reporter.type: 'json' flips BaseReporter._save() from
#                       to_csv to to_json  (petsard/reporter/reporter_base.py)
#
# Synthesizer: method 'default' (PETsARD Gaussian Copula). The differentially
# private synthesizers (DPflow_Copula, DPflow_AdvGAN) also take tables read
# from JSON, but they need a public column declaration (column_spec) and data
# without missing values, and run without a Preprocessor. This file keeps its
# planted nulls to test the Preprocessor, so it uses the default synthesizer.
# The differentially private examples are run_dp1_copula.py and run_dp2_advgan.py.
#
# NOTE ON BLOCK ORDER: petsard/config.py:40 does `self.sequence =
# list(self.yaml.keys())` -- the execution order IS the YAML key order. Do not
# reorder these blocks.
#
# Run from tutorial/:  python -X utf8 run_json1.py
# =============================================================================

Loader:
  load_json:
    # .json extension is what selects LoaderPandasJson. The file is a top-level
    # JSON array of objects (records orient), which pd.read_json accepts with
    # no extra arguments.
    filepath: ./demo_json/data/test_json_data.json

Preprocessor:
  demo:
    # Encodes the categorical 'sex'/'smoker' columns and fills the two nulls
    # planted in the test data.
    method: 'default'

Synthesizer:
  demo:
    method: 'default'   # PETsARD Gaussian Copula
    sample_num_rows: 100

Postprocessor:
  demo:
    # Inverts the preprocessor so the reported data is back in original units
    # and 'sex'/'smoker' are strings again -- which also makes the JSON output
    # human-readable.
    method: 'default'

Evaluator:
  # Only here so `save_report` has something to report. Must sit BEFORE
  # Reporter -- see the block-order note above.
  diagnostic:
    method: sdmetrics-diagnosticreport

Reporter:
  save_synthetic:
    method: save_data
    source: Postprocessor
    output: './demo_json/output/test_json'
    type: 'json'        # <-- the feature under test
  evaluation_report:
    method: save_report
    granularity: global
    output: './demo_json/output/test_json'
    type: 'json'        # <-- same flag on the other _save() caller
...
