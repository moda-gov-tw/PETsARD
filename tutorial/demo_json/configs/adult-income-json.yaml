---
# Usability check for data/adult-income.json (21 MB, 48,842 x 15).
#
# Uses method: 'default' (PETsARD Gaussian Copula), so the full 48,842-row
# file runs quickly. AdvGAN is demonstrated in test_json_advgan.yaml
# (run_json1.py).
#
# Run from tutorial/:  python -X utf8 run_json2.py

Loader:
  load_json:
    filepath: ./demo_json/data/adult-income.json

Preprocessor:
  demo:
    method: 'default'
    # 本資料多個數值欄位以單一數值為主(例如0)，處理序列不含outlier，以保留資料列與欄位間之關聯
    sequence: [missing, encoder, scaler]

Synthesizer:
  demo:
    method: 'default'

Postprocessor:
  demo:
    method: 'default'

Evaluator:
  diagnostic:
    method: sdmetrics-diagnosticreport

Reporter:
  save_synthetic:
    method: save_data
    source: Postprocessor
    output: './demo_json/output/output_adult'
    type: 'json'
  evaluation_report:
    method: save_report
    granularity: global
    output: './demo_json/output/output_adult'
    type: 'json'
...
