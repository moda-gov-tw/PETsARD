services:
  petsard:
    image: ghcr.io/moda-gov-tw/petsard:main
    # Always build from this repository's Dockerfile (`docker compose up` or `docker compose build`);
    # pull_policy: build stops Compose from pulling the prebuilt image named above
    build: .
    pull_policy: build
    platform: linux/amd64
    restart: unless-stopped
    # privileged: true
    ## docker gpu passthrough, not tested
    ## https://docs.docker.com/compose/how-tos/gpu-support/

    ## https://docs.docker.com/compose/how-tos/gpu-support/
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              driver: nvidia
              count: all
    ## podman gpu passthrough, tested
    # devices:
    #   - nvidia.com/gpu=all
    ## Jupyter token: printed by `docker compose logs petsard`, or set your own here
    # environment:
    #   - JUPYTER_TOKEN=change-me
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      # MUST make a "data" dir alongside this "compose.yml" file
      - ./data:/app/data
    entrypoint: "bash /app/entrypoint.sh"
