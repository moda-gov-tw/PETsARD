---
# =============================================================================
# DP LLM text synthesizer (dp-llm-synth) -> text_evaluator: Anonymeter + MLUtility
#
# The privacy and utility counterpart to text-evaluation.yaml, which covers SDMetrics.
# Everything here needs `control` -- original rows held out from synthesis --
# hence the Splitter and class_name: TextEvaluatorWithControl.
#
# Why control is required:
#   Anonymeter runs its attack against the training rows AND against control rows
#   the synthesizer never saw, then reports the residual
#       (attack_rate - control_rate) / (1 - control_rate)
#   Without control it cannot separate a real leak from the model having learnt
#   the population distribution.
#   MLUtility trains one model on ori and one on syn, then tests both on control.
#
# Run:  python -c "from petsard import Executor; Executor('demo/petsard-yaml/evaluator-yaml/text-evaluation_with-control.yaml').run()"
# =============================================================================

Loader:
  load_bloodpressure:
    filepath: benchmark://bloodpressure-text

# 101 rows -> 80 train (fed to the synthesizer) + 21 validation (control).
# Keep train larger than validation: Anonymeter defaults to max_n_attacks, which
# sets n_attacks to the control size and then samples that many rows from ori.
Splitter:
  holdout:
    num_samples: 1
    train_split_ratio: 0.8

Synthesizer:
  dp_llm:
    method: custom_method
    module_path: petsard/synthesizer/DP_LLM_synthesizer.py
    class_name: DP_LLM_synthesizer

    # The profile is released from the 80 training rows only; the 21 control rows
    # are never read by the synthesizer. With epochs: 0 the whole budget is spent there.
    # 輪廓只由80筆訓練資料釋出，21筆控制資料不經合成器；epochs: 0 時預算全花在輪廓。
    epsilon: 8
    delta: 1.0e-5
    epochs: 0
    stop_after_epoch: 0
    # This example uses 20 rows to keep the run short; a value close to the training
    # split (80 rows) gives more stable Anonymeter and MLUtility scores.
    # 本範例為縮短執行時間使用20筆；接近訓練資料筆數(80筆)時，Anonymeter與MLUtility分數較穩定。
    num_samples_schedule: 20
    sample_num_rows: 20

    api_type: lmstudio
    api_url: "http://127.0.0.1:1234/v1"
    api_key: lm-studio                # LM Studio does not check this value / LM Studio 不檢查此值
    model: openai/gpt-oss-20b         # use the model id LM Studio shows / 填 LM Studio 顯示的模型 ID
    temperature: 1.0
    num_procs: 4
    sleep_time: 0
    max_retries: 3
    output_dir: ./llm_synth_output/text_eval_with-control
    log_folder: ./LOG_FILES

Evaluator:
  text_eval:
    method: custom_method
    module_path: petsard/evaluator/text_evaluator.py
    class_name: TextEvaluatorWithControl

    # Your parser. Contract:  def text_parser(df) -> pd.DataFrame
    text_parser: petsard/synthesizer/DP_LLM_synth/utils/bloodpressure_text_parser.py
    # text_parser_entry: text_parser

    # The parsed frames are written here for inspection; each column holds the
    # values that the text parser extracted from the ori, syn and control text.
    output_dir: ./llm_synth_output/text_eval_with-control/parsed

    Evaluator:
      singling_out_risk:
        method: anonymeter-singlingout
        n_attacks: 400
        max_attempts: 4000
        # mode uses its default (multivariate).

      linkability_risk:
        method: anonymeter-linkability
        aux_cols:
          # Group 1: what an attacker might hold from a demographic source
          - [gender, age]
          # Group 2: what a separate clinical source might hold
          - [systolic, diastolic]

      inference_risk:
        method: anonymeter-inference
        secret: age
        max_n_attacks: false
        n_attacks: 8

      classification_utility:
        method: mlutility
        task_type: classification
        # bp_label is largely derivable from systolic, so both absolute scores
        # will be high. The meaningful number is the ori-vs-syn difference.
        target: bp_label

Reporter:
  save_synth:
    method: save_data
    source: Synthesizer
    output: 'dp_llm_text_eval_with-control'
  save_eval:
    method: save_report
    granularity:
      - global
      - columnwise
      - details
    output: 'dp_llm_text_eval_with-control'
...
