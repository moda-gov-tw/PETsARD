---
# =============================================================================
# DP LLM text synthesizer (dp-llm-synth) -> text_evaluator
#
# dp-llm-synth emits natural-language text; PETsARD's evaluators are column-
# addressed. text_evaluator bridges the two: it parses ori and syn with your
# parser, then fans the parsed frames out to any number of native evaluators.
#
#   text_parser   path to a .py file with  def text_parser(df) -> pd.DataFrame
#   Evaluator     nested block of native evaluators; every key besides `method`
#                 is forwarded verbatim to that evaluator
#
# Class choice (PETsARD reads REQUIRED_INPUT_KEYS off the class, so it cannot
# come from config):
#   TextEvaluator             ori + syn           SDMetrics, mpuccs   <- this file
#   TextEvaluatorWithControl  ori + syn + control Anonymeter, MLUtility
#
# See text-evaluation_with-control.yaml for the Anonymeter + MLUtility variant, which adds a
# Splitter to produce the control set those evaluators require.
#
# Run:  python -c "from petsard import Executor; Executor('demo/petsard-yaml/evaluator-yaml/text-evaluation.yaml').run()"
# =============================================================================

Loader:
  load_bloodpressure:
    filepath: benchmark://bloodpressure-text

Synthesizer:
  dp_llm:
    method: custom_method
    module_path: petsard/synthesizer/DP_LLM_synthesizer.py
    class_name: DP_LLM_synthesizer

    # The only step that reads the data is the release of a differentially private
    # data profile; with epochs: 0 the whole budget (epsilon, delta) is spent there.
    # 唯一讀取資料的步驟是釋出差分隱私資料輪廓；epochs: 0 時預算(ε, δ)全花在這一步。
    epsilon: 8
    delta: 1.0e-5
    epochs: 0
    stop_after_epoch: 0
    num_samples_schedule: 50
    sample_num_rows: 50

    api_type: lmstudio
    api_url: "http://127.0.0.1:1234/v1"
    api_key: lm-studio                # LM Studio does not check this value / LM Studio 不檢查此值
    model: openai/gpt-oss-20b         # use the model id LM Studio shows / 填 LM Studio 顯示的模型 ID
    temperature: 1.0
    num_procs: 4
    sleep_time: 0
    max_retries: 3
    output_dir: ./llm_synth_output/text_eval
    log_folder: ./LOG_FILES

Evaluator:
  text_eval:
    method: custom_method
    module_path: petsard/evaluator/text_evaluator.py
    class_name: TextEvaluator

    # Your parser. Contract:  def text_parser(df) -> pd.DataFrame
    text_parser: petsard/synthesizer/DP_LLM_synth/utils/bloodpressure_text_parser.py
    # text_parser_entry: text_parser

    # The parsed frames are written here for inspection; each column holds the
    # values that the text parser extracted from the original and synthetic text.
    output_dir: ./llm_synth_output/text_eval/parsed

    # Native evaluators run on the parsed frames. Add as many as you like;
    # each one's own arguments sit beside its `method`.
    Evaluator:
      validity_check:
        method: sdmetrics-diagnosticreport
      fidelity_check:
        method: sdmetrics-qualityreport

Reporter:
  save_synth:
    method: save_data
    source: Synthesizer
    output: 'dp_llm_text_eval'
  save_eval:
    method: save_report
    granularity:
      - global
      - columnwise
      - details
    output: 'dp_llm_text_eval'
...
